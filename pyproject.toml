[project]
name = "mem-alive-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.0",
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]   # E/F = pyflakes+pycodestyle basics, I = import sorting

[tool.pytest.ini_options]
asyncio_mode = "auto"
