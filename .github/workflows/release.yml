name: Publish to PyPI
run-name: Publish mem-alive ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "PyPI version to publish (for example, 0.1.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main

      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Verify package
        run: |
          uv run --locked --package mem-alive --extra lancedb --group dev pytest -q
          uv run --locked --package mem-alive --extra lancedb --group dev ruff check .
          uv run --locked --package mem-alive --extra lancedb --group dev ty check

      - name: Set release version and build
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          uv version --package mem-alive --frozen "$RELEASE_VERSION"
          uv build --package mem-alive --no-sources

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
