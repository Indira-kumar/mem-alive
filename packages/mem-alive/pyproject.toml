[project]
name = "mem-alive"
version = "0.1.0"
description = "A memory layer for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "indira-kumar", email = "indirakumarak@gmail.com" },
]
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
lancedb = ["lancedb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mem_alive"]
